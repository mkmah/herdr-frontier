name: Release

# TanStack/ai model (ADR 0003): a push to a release branch runs tests, then
# changesets opens/updates the "ci: Version Packages" PR while pending
# changesets exist. Merging that PR is the release act: the merge push has no
# changesets left, so the publish step runs — scripts/release.ts tags vX.Y.Z
# and creates the GitHub Release from the CHANGELOG via the API. Nothing ever
# pushes to main directly; the ephemeral GITHUB_TOKEN is the only credential.
on:
  push:
    branches: [main, alpha, beta, rc]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.repository_owner == 'mkmah'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Test & typecheck
        env:
          HERDR_BIN_PATH: /does-not-exist/herdr
          HERDR_SOCKET_PATH: ""
        run: |
          bun test
          bunx tsc --noEmit

  release:
    name: Release
    needs: test
    if: github.repository_owner == 'mkmah'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub Release in scripts/release.ts
      pull-requests: write # the "ci: Version Packages" PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # changesets/action pushes the version branch with the checkout
          # credential; that credential is the ephemeral GITHUB_TOKEN
          # (TanStack model). No other workflow in this repo persists
          # credentials.
          persist-credentials: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run Changesets (version PR) or publish
        id: changesets
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          # v2 renamed inputs; the action is used only for the version PR —
          # publishing is our own step below (the v2 publish path requires
          # CHANGESETS_OUTPUT plumbing meant for npm packages).
          version-script: bun run version
          commit-message: 'ci: Version Packages'
          pr-title: 'ci: Version Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tag & GitHub Release
        # No changesets on this push = the Version Packages PR merged.
        if: steps.changesets.outputs.has-changesets == 'false'
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
