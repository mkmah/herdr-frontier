id = "herdr-frontier"
name = "herdr-frontier"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "OpenTUI/Solid render layer that orchestrates the Matt Pocock skill workflow across a dependency graph of issues, on a multi-tracker substrate."
platforms = ["macos", "linux"]

# Remote GitHub install: Bun preflight → production deps → compile → native setup.
# Local `herdr plugin link` / `bun run dev` do not run [[build]] — they run the
# working tree.
[[build]]
command = ["sh", "scripts/preflight.sh"]

[[build]]
command = ["bun", "install", "--production", "--frozen-lockfile"]

[[build]]
command = ["bun", "run", "scripts/build.ts"]

# The read-only Issue list — the tracer-bullet pane (issue 09). herdr spawns
# `command` as the pane's foreground process; it owns stdout like any TUI. The
# compiled binary embeds the Solid JSX transform, so the pane runs it directly.
[[panes]]
id = "issues"
title = "herdr-frontier Issues"
placement = "split"
command = ["./bin/herdr-frontier"]

# Open the pane imperatively (declared panes surface via `herdr plugin pane open`).
# Shells out through `$HERDR_BIN_PATH` (injected by herdr) since command vectors
# are exec'd directly, not through a shell. Like open-tab below, the opened pane
# is renamed so it carries a stable label instead of the manifest default.
[[actions]]
id = "open"
title = "Open herdr-frontier issues"
contexts = ["workspace"]
command = ["sh", "-c", "pane_id=$(\"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-frontier --entrypoint issues --placement split --focus | grep -o '\"pane_id\":\"[^\"]*\"' | head -1 | cut -d'\"' -f4) && test -n \"$pane_id\" && \"$HERDR_BIN_PATH\" pane rename \"$pane_id\" Issues"]

# Open the issue list in its own tab (same pane, dedicated tab instead of a split).
# herdr names new plugin-pane tabs by number; grab the created tab id from the
# open response and rename it (plugin.pane.open exposes no label parameter).
[[actions]]
id = "open-tab"
title = "Open herdr-frontier issues in a tab"
contexts = ["workspace"]
command = ["sh", "-c", "tab_id=$(\"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-frontier --entrypoint issues --placement tab --focus | grep -o '\"tab_id\":\"[^\"]*\"' | head -1 | cut -d'\"' -f4) && test -n \"$tab_id\" && \"$HERDR_BIN_PATH\" tab rename \"$tab_id\" Issues"]
