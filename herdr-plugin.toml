id = "herdr-frontier"
name = "herdr-frontier"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "OpenTUI/Solid render layer that orchestrates the Matt Pocock skill workflow across a dependency graph of issues, on a multi-tracker substrate."
platforms = ["macos", "linux"]

# Remote GitHub install: Bun preflight → production deps → compile → native setup.
# Local `herdr plugin link` / `bun run dev` do not run [[build]] — they run the
# working tree.
[[build]]
command = ["sh", "scripts/preflight.sh"]

[[build]]
command = ["bun", "install", "--production", "--frozen-lockfile"]

[[build]]
command = ["bun", "run", "scripts/build.ts"]

# The read-only Issue list — the tracer-bullet pane (issue 09). herdr spawns
# `command` as the pane's foreground process; it owns stdout like any TUI. The
# compiled binary embeds the Solid JSX transform, so the pane runs it directly.
[[panes]]
id = "issues"
title = "herdr-frontier Issues"
placement = "split"
command = ["./bin/herdr-frontier"]

# Open the pane imperatively (declared panes surface via `herdr plugin pane open`).
# Shells out through `$HERDR_BIN_PATH` (injected by herdr) since command vectors
# are exec'd directly, not through a shell.
[[actions]]
id = "open"
title = "Open herdr-frontier issues"
contexts = ["workspace"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-frontier --entrypoint issues --placement split --focus"]